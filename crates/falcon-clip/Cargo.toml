[package]
name = "falcon-clip"
description = "On-device image and text embeddings for falcon's AI Search"
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
falcon-library = { path = "../falcon-library" }
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = { version = "0.11.1", default-features = false }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
image = "0.25"
sha2 = "0.11"
blake3 = "1"
ureq = "3"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.1", features = ["metal"] }
candle-nn = { version = "0.11.1", features = ["metal"] }
candle-transformers = { version = "0.11.1", default-features = false, features = ["metal"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
