[package]
name = "falcon-server"
description = "Eagle-compatible local HTTP API for falcon libraries"
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
falcon-library = { path = "../falcon-library" }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
ureq = "3"
base64 = "0.22"
tempfile = "3"
