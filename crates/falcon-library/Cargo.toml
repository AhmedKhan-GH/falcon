[package]
name = "falcon-library"
description = "Read and write Eagle-format asset libraries: import, thumbnails, palettes, search, smart folders"
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
image = "0.25"
fastrand = "2"
webp = "0.3.1"
resvg = "0.49.0"
filetime = "0.2.29"
unicode-normalization = "0.1.26"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
