[package]
name = "falcon-library"
description = "Read and write Eagle-format asset libraries: import, thumbnails, palettes, search, smart folders"
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
image = "0.25"
fastrand = "2"
webp = "0.3.1"
resvg = "0.49.0"
filetime = "0.2.29"
unicode-normalization = "0.1.26"
tempfile = "3"
zip = { version = "9.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
kamadak-exif = "0.6"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "ogg", "vorbis", "adpcm"] }
ttf-parser = "0.25"
miniz_oxide = "0.8"
blake3 = "1"
num-bigint = "0.4"
brotli-decompressor = "5"
regex = "1"
ufbx = "0.8.0"
roxmltree = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-core-graphics", "CGImageSource", "CGImageDestination"] }

[dev-dependencies]
tempfile = "3"

