[package]
name = "falcon-app"
description = "Desktop asset manager for Eagle-format libraries"
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true

[[bin]]
name = "falcon-app"
path = "src/main.rs"

[dependencies]
falcon-library = { path = "../falcon-library" }
falcon-server = { path = "../falcon-server" }
falcon-video = { path = "../falcon-video" }
falcon-pdf = { path = "../falcon-pdf" }
eframe = { version = "0.37.0", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.17.2"
lru = "0.19.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["gif", "png", "webp"] }
gif = "0.14"
arboard = "3"
drag = "2.1"
rodio = { version = "0.23", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
skrifa = "0.44"
blake3 = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSCell", "NSScreen"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
webp = "0.3.1"
png = "0.18"
