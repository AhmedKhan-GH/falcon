[package]
name = "falcon-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "falcon-app"
path = "src/main.rs"

[dependencies]
falcon-library = { path = "../falcon-library" }
falcon-server = { path = "../falcon-server" }
eframe = { version = "0.37.0", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.17.2"
lru = "0.19.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
arboard = "3"
drag = "2.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
