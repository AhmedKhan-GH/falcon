[package]
name = "falcon-app"
description = "Desktop asset manager for Eagle-format libraries"
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true

[[bin]]
name = "falcon-app"
path = "src/main.rs"

[[test]]
name = "page_shot"
harness = false

[[test]]
name = "web_gray"
harness = false

[dependencies]
falcon-ai = { path = "../falcon-ai" }
falcon-library = { path = "../falcon-library" }
falcon-server = { path = "../falcon-server" }
falcon-clip = { path = "../falcon-clip" }
falcon-video = { path = "../falcon-video" }
falcon-pdf = { path = "../falcon-pdf" }
eframe = { version = "0.37.0", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.17.2"
lru = "0.19.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
gif = "0.14"
tiff = "0.11"
arboard = "3"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
skrifa = "0.44"
blake3 = "1"
sys-locale = "0.3"
ureq = "3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = "5"
zip = { version = "9.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
drag = "2.1"
objc2 = "0.6"
objc2-foundation = "0.3"
raw-window-handle = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSDockTile", "NSProgressIndicator", "NSImageView", "NSImage", "NSView", "NSControl", "NSWorkspace", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSCell", "NSScreen", "NSWindow", "NSGraphics", "NSButton", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSVisualEffectView"] }

[dev-dependencies]
moxcms = "0.8"
accesskit_consumer = "0.39"
serde_json = "1"
tempfile = "3"
webp = "0.3.1"
png = "0.18"
