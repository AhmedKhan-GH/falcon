name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per branch, so a manual test run can't cancel a deploy from main.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The API docs come from the Rust sources, so they are only made again when those change.
  api-docs-key:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
      hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "key=api-docs-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**', 'crates/**') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: target/doc
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
          enableCrossOsArchive: true

  # On macOS, since rustdoc documents the code as built for the system it runs on.
  api-docs:
    needs: api-docs-key
    if: needs.api-docs-key.outputs.hit != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
      - uses: actions/cache/save@v4
        with:
          path: target/doc
          key: ${{ needs.api-docs-key.outputs.key }}
          enableCrossOsArchive: true

  build:
    needs: [api-docs-key, api-docs]
    if: ${{ !cancelled() && needs.api-docs-key.result == 'success' && (needs.api-docs.result == 'success' || needs.api-docs.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: target/doc
          key: ${{ needs.api-docs-key.outputs.key }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true
      - name: Install mdBook
        run: |
          curl -fsSL -o mdbook.tar.gz https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  mdbook.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf mdbook.tar.gz -C "$HOME/.local/bin"
          rm mdbook.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the site and the book
        run: |
          rm -rf docs/src/api && cp -R target/doc docs/src/api
          mdbook build docs
          rm -rf public && mkdir public
          cp -R site/. public/
          cp -R docs/images public/images
          cp -R docs/brand public/brand
          cp -R docs/book public/book
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    # A manual run on another branch checks the build without publishing it.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
