name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mdBook
        run: cargo install mdbook --locked
      - name: Build the site, the book and the API docs
        run: |
          cargo doc --workspace --no-deps
          rm -rf docs/src/api && cp -R target/doc docs/src/api
          mdbook build docs
          rm -rf public && mkdir public
          cp -R site/. public/
          cp -R docs/images public/images
          cp -R docs/brand public/brand
          cp -R docs/book public/book
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
