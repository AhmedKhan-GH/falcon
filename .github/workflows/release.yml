name: Release

# Pushing a tag like v0.1.0 builds the macOS, Linux and Windows packages and publishes them together
# as a GitHub release, once all have built. The website links to the latest release's assets by their
# fixed names. A pull request that changes the packaging builds them too, without publishing; the
# packages are kept as the run's artifacts.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - crates/falcon-app/build.rs
      - crates/falcon-ifc/build.rs
      - scripts/build-ffmpeg.sh
      - scripts/falcon.nsi
      - scripts/bundle.sh
      - scripts/fetch-web-ifc.sh
      - scripts/package-linux.sh
      - scripts/package-macos.sh
      - scripts/package-windows.sh

permissions:
  contents: read

jobs:
  macos:
    # Apple Silicon. package-macos.sh builds for macOS 12 whatever macOS the runner has.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-ffmpeg.sh
      - run: scripts/fetch-web-ifc.sh
      - run: scripts/package-macos.sh
      - name: Test the FFmpeg inside the app
        run: FALCON_FFMPEG_DIR="$PWD/target/release/Falcon.app/Contents/Frameworks" cargo test -p falcon-ffmpeg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/macos/Falcon-arm64.dmg
          if-no-files-found: error

  linux:
    # The oldest supported Ubuntu, since packages only run on a glibc at least this new.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev nasm zlib1g-dev python3-venv
      - run: scripts/build-ffmpeg.sh
      - run: cargo test -p falcon-ffmpeg
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/linux/Falcon-x86_64.AppImage
            target/linux/Falcon-x86_64.deb
          if-no-files-found: error

  windows:
    # FFmpeg builds with MSYS2's mingw-w64 and Falcon with Visual Studio's C++ tools. The shell sees
    # both, and the Python and cargo set up below. MSYS2 has no old versions to pin, so its packages
    # are named here and BUILD-INFO.txt records the compiler they came to.
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            make
            diffutils
            tar
            xz
            curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-zlib
      - run: scripts/build-ffmpeg.sh
      - run: cargo test -p falcon-ffmpeg
      - run: scripts/fetch-web-ifc.sh
      - run: scripts/package-windows.sh
      - name: Test the FFmpeg inside the app folder
        run: FALCON_FFMPEG_DIR="$PWD/target/windows/Falcon" cargo test -p falcon-ffmpeg
      - name: Test the FFmpeg inside the portable zip
        run: |
          mkdir -p target/portable-test
          "$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -xf target/windows/Falcon-x86_64-portable.zip -C target/portable-test
          [ -f target/portable-test/Falcon/falcon-app.exe ] && [ -f target/portable-test/Falcon/lib/avformat-61.dll ]
          FALCON_FFMPEG_DIR="$PWD/target/portable-test/Falcon/lib" cargo test -p falcon-ffmpeg
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/windows/Falcon-x86_64-setup.exe
            target/windows/Falcon-x86_64-portable.zip
          if-no-files-found: error

  publish:
    needs: [macos, linux, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME doesn't match version $version" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum Falcon-arm64.dmg Falcon-x86_64.AppImage Falcon-x86_64.deb Falcon-x86_64-setup.exe Falcon-x86_64-portable.zip > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Falcon-arm64.dmg dist/Falcon-x86_64.AppImage dist/Falcon-x86_64.deb dist/Falcon-x86_64-setup.exe dist/Falcon-x86_64-portable.zip dist/SHA256SUMS \
            --title "Falcon $GITHUB_REF_NAME" --notes-file docs/release-notes.md
