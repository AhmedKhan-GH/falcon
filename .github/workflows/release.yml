name: Release

# Pushing a tag like v0.1.0 builds the Linux packages and publishes them as a GitHub release.
# The website links to the latest release's assets by their fixed names.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported Ubuntu, since packages only run on a glibc at least this new.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME doesn't match version $version" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev nasm zlib1g-dev python3-venv
      - run: scripts/build-ffmpeg.sh
      - run: cargo test -p falcon-ffmpeg
      - run: scripts/package-linux.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/linux/Falcon-x86_64.AppImage target/linux/falcon_amd64.deb target/linux/SHA256SUMS \
            --title "Falcon $GITHUB_REF_NAME" --notes-file docs/release-notes.md
