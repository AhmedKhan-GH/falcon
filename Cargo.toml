[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[package]
name = "falcon"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
falcon-library = { path = "crates/falcon-library" }
