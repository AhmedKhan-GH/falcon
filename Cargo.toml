[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AhmedKhan-GH/falcon"
homepage = "https://ahmedkhan-gh.github.io/falcon/"

[package]
name = "falcon"
description = "Command-line tool for Eagle-format asset libraries"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
falcon-library = { path = "crates/falcon-library" }
falcon-server = { path = "crates/falcon-server" }
